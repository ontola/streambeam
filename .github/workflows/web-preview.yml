name: Browser preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  browser-stream:
    name: Native QUIC to browser video
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/view/package-lock.json
      - run: cargo test -p streambeam-devtools --features web --bin webbridge --locked
      - run: cargo clippy --no-deps -p streambeam-devtools --features web --bin webbridge --locked -- -D warnings
      - run: cargo build -p streambeam-devtools --features web --bin webbridge --bin fakehost --locked
      - run: npm ci --prefix site/view --ignore-scripts
      - name: Install Chrome for real H.264 decoding
        working-directory: site/view
        run: npx playwright install --with-deps chrome
      - run: npm test --prefix site/view
        env:
          STREAMBEAM_WEB_ARTIFACTS: ${{ runner.temp }}/web-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: browser-preview-fixture
          path: ${{ runner.temp }}/web-preview/browser-viewer.png
          if-no-files-found: error

name: Desktop distribution candidates

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Distribution target (builds an artifact; does not publish a store listing)
        required: true
        type: choice
        options: [macos, windows-store]
      windows_version:
        description: Unused Partner Center package version, e.g. 0.1.3.0 (Windows only)
        required: false
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  macos:
    if: inputs.platform == 'macos'
    name: Signed and notarized macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require production signing and notarization credentials
        shell: bash
        run: |
          for name in MACOS_SIGN_IDENTITY MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter test --no-pub
        working-directory: app
      - run: scripts/build-macos-local.sh
      - run: python3 scripts/prepare-macos-signing.py
      - name: Sign, notarize, staple and verify a separate release copy
        env:
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/streambeam-macos-signing/AuthKey.p8
        run: python3 scripts/package-macos-release.py --app app/build/macos/Build/Products/Release/streambeam.app --output build/macos-distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-signed-notarized
          path: |
            build/macos-distribution/StreamBeam.zip
            build/macos-distribution/notarization.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/streambeam-macos-signing/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/streambeam-macos-signing"

  windows-store:
    if: inputs.platform == 'windows-store'
    name: Windows Store x64 MSIX candidate
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_STORE_VERSION: ${{ inputs.windows_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require real Partner Center identity
        shell: pwsh
        run: |
          foreach ($name in @('WINDOWS_STORE_IDENTITY_NAME', 'WINDOWS_STORE_PUBLISHER', 'WINDOWS_STORE_PUBLISHER_DISPLAY_NAME', 'WINDOWS_STORE_VERSION')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/rust
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter test --no-pub
        working-directory: app
      - run: cargo build --release --locked -p streambeam-host -p streambeam-svc --bins
      - run: flutter build windows --release --no-pub
        working-directory: app
        env:
          CARGOKIT_BUILD_ROOT: ${{ runner.temp }}/sb-rust
      - run: ./scripts/package-windows.ps1
      - name: Package for Store signing on certification
        shell: pwsh
        run: ./scripts/package-windows-store.ps1 -IdentityName $env:WINDOWS_STORE_IDENTITY_NAME -Publisher $env:WINDOWS_STORE_PUBLISHER -PublisherDisplayName $env:WINDOWS_STORE_PUBLISHER_DISPLAY_NAME -Version $env:WINDOWS_STORE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-store-x64-submission
          path: build/windows-store/*.msix
          if-no-files-found: error
          retention-days: 14

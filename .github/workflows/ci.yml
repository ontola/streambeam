name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.44.7'
  # Vendored Opus still declares a pre-3.5 CMake minimum.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path app/rust/Cargo.toml --all --check

  rust-test:
    name: Rust tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Warnings remain visible; compilation failures are blocking.
      - run: cargo clippy --workspace --all-targets --locked

  windows-release:
    name: Windows x64 release app and host
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/rust
      - run: cargo check --workspace --locked
      - run: cargo build --release --locked -p streambeam-host -p streambeam-svc --bins
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter build windows --release --no-pub
        working-directory: app
      - name: Package app, runtime and secure-desktop helpers
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-ci
          path: build/desktop/streambeam-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos-release:
    name: macOS ${{ matrix.arch }} release app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/rust
      - run: cargo check --workspace --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build native release app
        run: scripts/build-macos-local.sh
      - name: Verify and archive app (ad-hoc CI signature)
        run: |
          app=app/build/macos/Build/Products/Release/streambeam.app
          test -d "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p build/desktop
          ditto -c -k --keepParent "$app" "build/desktop/streambeam-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-ci
          path: build/desktop/streambeam-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  linux-release:
    # The Linux shell builds, but native capture/decoder/input are not ported.
    name: Linux x64 experimental app build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Flutter desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter build linux --release --no-pub
        working-directory: app
      - name: Archive experimental Linux bundle
        run: |
          test -x app/build/linux/x64/release/bundle/streambeam
          test -f app/build/linux/x64/release/bundle/lib/librust_lib_streambeam.so
          mkdir -p build/desktop
          tar -czf build/desktop/streambeam-linux-x64-experimental.tar.gz -C app/build/linux/x64/release bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-experimental-ci
          path: build/desktop/streambeam-linux-x64-experimental.tar.gz
          if-no-files-found: error
          retention-days: 14

  flutter-test:
    name: Flutter analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Test native build toolchain selection
        working-directory: app/rust_builder/cargokit/build_tool
        run: |
          dart pub get
          dart run test/rustup_check.dart
          dart run test/android_outputs_check.dart

  android-release:
    name: Android release and scanner regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust -> ../build/rust_lib_streambeam/build
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: app
      - run: python3 scripts/check-android-scanner.py
      - name: Reject unsigned store bundles
        working-directory: app
        run: |
          if flutter build appbundle --release --no-pub --target-platform android-arm64 > "$RUNNER_TEMP/unsigned-bundle.log" 2>&1; then
            echo "::error::An unsigned store bundle unexpectedly built successfully"
            exit 1
          fi
          grep -F 'Release App Bundles require the StreamBeam upload signing key.' "$RUNNER_TEMP/unsigned-bundle.log"
      # This artifact uses the runner's development signer. Published APKs are
      # signed locally with the persistent preview key (see docs/RELEASING.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-ci
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-r8-reports
          path: app/build/app/outputs/mapping/release/
          retention-days: 14

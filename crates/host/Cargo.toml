[package]
name = "streambeam-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
streambeam-proto = { workspace = true }
streambeam-net = { workspace = true }
streambeam-core = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
quinn = { workspace = true }
clap = { workspace = true }
opus = { version = "0.3", optional = true }
qrcode = "0.14"

[features]
default = ["audio"]
# Host-side Opus (test-tone) audio. Off for the Android host build, which is
# video-only in v1 and would otherwise need the Opus C toolchain (audiopus_sys).
audio = ["dep:opus"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Text clipboard bridge for the headless worker (clipboard.rs).
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
viiper-client = "0.7"
libloading = "0.8"
# Higher-level COM bindings for desktop capture (DXGI) + H.264 encode (Media Foundation)
# + direct NVENC SDK (nvenc.rs) for hardware encoding.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
    # Naming the security context the capture runs in (wgc.rs): SYSTEM vs a
    # real user is what decides whether WGC works, and guessing cost a day.
    "Win32_Security_Authorization",
    "Win32_System_RemoteDesktop",
    "Win32_System_Memory",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Power",
    # SDR-white-level query for the HDR capture tone-map (capture.rs).
    "Win32_Devices_Display",
    # WASAPI loopback system-audio capture (audio_capture_win.rs).
    "Win32_Media_Audio",
    # PROPVARIANT plumbing IMMDevice::Activate needs.
    "Win32_System_Com_StructuredStorage",
    # Adapter MAC/subnet lookup for Wake-on-LAN facts (power.rs).
    "Win32_NetworkManagement_IpHelper",
    # Desktop switching for the secure-desktop worker (desktop_win.rs).
    "Win32_System_StationsAndDesktops",
    # Per-monitor DPI awareness, required by DuplicateOutput1 (main.rs).
    "Win32_UI_HiDpi",
    # Elevated (runas) service enable/disable for the app toggle (secure_desktop.rs).
    # ShellExecuteExW's SHELLEXECUTEINFOW carries an hkeyClass, so the W variant
    # is gated behind Win32_System_Registry in the windows crate.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    # Windows.Graphics.Capture fallback for when Desktop Duplication can't see
    # the screen — a game holding exclusive presentation (wgc.rs).
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics2 = { version = "0.5.2", default-features = false, features = ["display", "event", "link"] }

[dev-dependencies]

[[bin]]
name = "streambeam-host"
path = "src/main.rs"

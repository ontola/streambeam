[package]
name = "streambeam-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
streambeam-proto = { workspace = true }
streambeam-net = { workspace = true }
streambeam-core = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
quinn = { workspace = true }
clap = { workspace = true }
opus = { version = "0.3", optional = true }
qrcode = "0.14"

[features]
default = ["audio"]
# Host-side Opus (test-tone) audio. Off for the Android host build, which is
# video-only in v1 and would otherwise need the Opus C toolchain (audiopus_sys).
audio = ["dep:opus"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
viiper-client = "0.7"
libloading = "0.8"
# Higher-level COM bindings for desktop capture (DXGI) + H.264 encode (Media Foundation)
# + direct NVENC SDK (nvenc.rs) for hardware encoding.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
] }

[dev-dependencies]

[[bin]]
name = "streambeam-host"
path = "src/main.rs"

[package]
name = "streambeam-devtools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
streambeam-proto = { workspace = true }
streambeam-net = { workspace = true }
streambeam-core = { workspace = true }
quinn = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
opus = "0.3"
wtransport = { version = "0.7.2", optional = true, default-features = false, features = ["self-signed", "ring", "quinn"] }
subtle = { workspace = true }
serde_json = { workspace = true }
url = { version = "2", optional = true }

[features]
web = ["dep:wtransport", "dep:url"]

[[bin]]
name = "fakehost"
path = "src/fakehost.rs"

[[bin]]
name = "devclient"
path = "src/devclient.rs"

[[bin]]
name = "playclient"
path = "src/playclient.rs"

[[bin]]
name = "streamdemo"
path = "src/streamdemo.rs"

[[bin]]
name = "hostdisc"
path = "src/hostdisc.rs"

[dev-dependencies]
streambeam-proto = { workspace = true }

[[bin]]
name = "webbridge"
path = "src/webbridge.rs"
required-features = ["web"]

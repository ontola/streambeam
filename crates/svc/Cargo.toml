[package]
name = "streambeam-svc"
version.workspace = true
edition.workspace = true
license.workspace = true

# Windows-only host service (docs/SECURE_DESKTOP.md). Joins the workspace but
# all real deps are Windows-gated so `cargo check` still works on macOS/WSL,
# same pattern as crates/host.
[dependencies]

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Environment",
    "Win32_System_SystemServices",
] }

[[bin]]
name = "streambeam-svc"
path = "src/main.rs"

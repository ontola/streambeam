<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/assets/streambeam-logo.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · StreamBeam</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --beam: #6C7BFF; --beam-strong: #8591FF; --live: #3DD68C;
    --bg: #0D0F1A; --card: #151827; --ink: #E9EAF2; --muted: #9CA0B8; --line: #262A3F;
    color-scheme: dark light;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #FAFAFD; --card: #FFFFFF; --ink: #14161F; --muted: #5A5E75;
            --line: #E3E5EF; --beam: #5563E8; --beam-strong: #4351DB; }
  }
  :root[data-theme="dark"] {
    --bg: #0D0F1A; --card: #151827; --ink: #E9EAF2; --muted: #9CA0B8;
    --line: #262A3F; --beam: #6C7BFF; --beam-strong: #8591FF;
  }
  :root[data-theme="light"] {
    --bg: #FAFAFD; --card: #FFFFFF; --ink: #14161F; --muted: #5A5E75;
    --line: #E3E5EF; --beam: #5563E8; --beam-strong: #4351DB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    max-width: 26rem; width: 100%; padding: 32px 28px; text-align: center;
  }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 22px; }
  h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; margin-bottom: 10px; }
  p { color: var(--muted); font-size: 0.95rem; }
  .actions { display: grid; gap: 10px; margin-top: 24px; }
  .btn {
    display: block; padding: 13px 18px; border-radius: 10px; font-weight: 600;
    font-size: 0.98rem; text-decoration: none; border: 1px solid transparent;
    cursor: pointer; background: none; color: var(--ink); font-family: inherit;
  }
  .btn-beam { background: var(--beam); color: #FFFFFF; }
  .btn-beam:hover { background: var(--beam-strong); }
  .btn-ghost { border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--beam); }
  .btn:focus-visible { outline: 2px solid var(--beam); outline-offset: 3px; }
  .hint { font-size: 0.82rem; margin-top: 18px; }
  .hint a { color: var(--beam-strong); }
  .ok { color: var(--live); }
  #copied { visibility: hidden; }
  .brand img { display: block; }
</style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/" style="color:inherit;text-decoration:none">
      <img src="/assets/streambeam-logo.svg" width="24" height="24" alt="">
      StreamBeam
    </a>
    <h1>This page doesn't exist</h1>
    <p>The link may be mistyped, or the page has moved.</p>
    <div class="actions">
      <a class="btn btn-beam" href="/">Go to the homepage</a>
    </div>
  </div>
</body>
</html>

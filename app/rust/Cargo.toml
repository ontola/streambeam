[package]
name = "rust_lib_streambeam"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
log = "0.4"
# Same quinn the core crates use — only for reading Connection::stats() in
# the playback diagnostics (ClientSession::conn is a quinn::Connection).
quinn = "0.11"
serde_json = "1"
streambeam-core = { path = "../../crates/core" }
streambeam-proto = { path = "../../crates/proto" }
streambeam-net = { path = "../../crates/net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
streambeam-host = { path = "../../crates/host" }

[target.'cfg(target_os = "macos")'.dependencies]
# Default features include `audio`: the macOS host Opus-encodes live
# ScreenCaptureKit system audio in Rust (see crates/host/src/audio.rs).
streambeam-host = { path = "../../crates/host" }

[target.'cfg(target_os = "android")'.dependencies]
streambeam-host = { path = "../../crates/host", default-features = false }
android_logger = "0.14"
jni = "0.21"
ndk = { version = "0.9", features = ["media", "nativewindow"] }
ndk-sys = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
